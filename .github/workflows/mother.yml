name: mother-agent
on:
  schedule:
    - cron: "43 21 * * *"      # 매일 06:43 KST 자동 운영
  workflow_dispatch:
    inputs:
      command:
        description: "실행할 명령 (예: daily / status / biz scout --market US / agent upgrade)"
        default: "daily"
      goal:
        description: "run 명령일 때 목표 (비우면 command만 실행)"
        default: ""
  push:
    paths: ["jarvis/jobs.json"]  # 작업큐에 추가하면 자동 처리

concurrency: { group: mother, cancel-in-progress: false }
permissions: { contents: write }

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          UPSTAGE_API_KEY: ${{ secrets.UPSTAGE_API_KEY }}
          CLOVA_API_KEY: ${{ secrets.CLOVA_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GH_SEARCH_TOKEN: ${{ secrets.GH_SEARCH_TOKEN }}
          CMD: ${{ github.event.inputs.command }}
          GOAL: ${{ github.event.inputs.goal }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then python -m mother jobs
          elif [ -n "$GOAL" ]; then python -m mother run "$GOAL"
          else python -m mother ${CMD:-daily}; fi | tee -a "$GITHUB_STEP_SUMMARY"
      - name: save results
        run: |
          git config user.name "mother-agent"
          git config user.email "mother-agent@users.noreply.github.com"
          git add data reports agents skills workspace || true
          git diff --cached --quiet || (git commit -m "mother: auto update $(date -u +%F)" && git push)
