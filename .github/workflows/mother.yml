name: mother-agent
on:
  schedule:
    - cron: "43 21 * * *"      # 매일 06:43 KST 자동 운영
  workflow_dispatch:
    inputs:
      command:
        description: "실행할 명령 (예: daily / status / biz scout --market US / agent upgrade)"
        default: "daily"
      goal:
        description: "run 명령일 때 목표 (비우면 command만 실행)"
        default: ""
  push:
    paths: ["jarvis/jobs.json"]  # 작업큐에 추가하면 자동 처리

permissions: { contents: write }

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # 대기 중이던 실행도 최신 상태에서 시작
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: install ffmpeg (숏츠 영상 제작용)
        if: github.event_name == 'schedule' || contains(github.event.inputs.command, 'daily') || contains(github.event.inputs.command, 'shorts') || contains(github.event.inputs.command, 'pipeline')
        run: |
          command -v ffmpeg >/dev/null && exit 0
          for i in 1 2 3; do   # 저장소 목록이 낡아 404 나면 새로 받고 재시도
            sudo apt-get update -qq && sudo apt-get install -y -qq --fix-missing ffmpeg >/dev/null && exit 0
            sleep 10
          done
          echo "⚠️ ffmpeg 설치 실패 — 숏츠만 건너뛰고 나머지는 계속"
      - name: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY || secrets.CLAUDE_API }}   # 다른 이름으로 저장해도 인식
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API || secrets.GOOGLE_AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.CHATGPT_API_KEY || secrets.CHATGPT_API || secrets.GPT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          UPSTAGE_API_KEY: ${{ secrets.UPSTAGE_API_KEY }}
          CLOVA_API_KEY: ${{ secrets.CLOVA_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || secrets.YOUTUBE_API }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          HF_API_KEY_ID: ${{ secrets.HF_API_KEY_ID }}
          HF_API_KEY_SECRET: ${{ secrets.HF_API_KEY_SECRET }}
          GH_SEARCH_TOKEN: ${{ secrets.GH_SEARCH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          CMD: ${{ github.event.inputs.command }}
          GOAL: ${{ github.event.inputs.goal }}
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail
          STATUS=0
          if [ "$EVENT" = "push" ]; then python -m mother jobs
          elif [ -n "$GOAL" ]; then python -m mother run "$GOAL"
          else python -c 'import os, shlex; from mother.__main__ import safe_main; safe_main(shlex.split(os.environ.get("CMD") or "daily"))'
          fi 2>&1 | tee out.txt | tee -a "$GITHUB_STEP_SUMMARY" || STATUS=$?
          python -m mother record "$STATUS" out.txt "${GOAL:-${CMD:-$EVENT}}" || true   # 앱에 명령 결과 표시
          python -m mother export || true   # 휴대폰 앱 데이터 갱신
          exit $STATUS
      - name: save results
        if: always()   # 실패해도 에러 기록(data/errors.jsonl)은 저장
        run: |
          git config user.name "mother-agent"
          git config user.email "mother-agent@users.noreply.github.com"
          git add data reports agents skills workspace pipelines shorts_factory || true
          git diff --cached --quiet || git commit -qm "mother: auto update $(date -u +%F)"
          for i in 1 2 3; do   # 다른 실행과 겹치면: 기록은 합치고(jsonl) 나머지는 이번 결과 우선
            git pull --rebase -X theirs -q origin main && git push -q && break || { git rebase --abort 2>/dev/null; sleep 5; }
          done
