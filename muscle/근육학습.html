<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>근육 움직임 학습</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--sub:#5d667a;--line:#e2e5ee;--accent:#3b6df0;--ag:#e0453a;--agS:#9e2018;--an:#2f7de1;--anS:#1b4f96;--other:#b9bfcc;--skin:#f3d9c4;--bone:#f4ead6;--boneS:#b59a63;--ok:#1f9d61;--soft:#eef3ff}
@media (prefers-color-scheme:dark){:root{--bg:#11141b;--card:#1a1f28;--ink:#e8ebf2;--sub:#a1a9b9;--line:#2b3240;--accent:#7a9bff;--other:#4a5262;--skin:#3a3230;--bone:#d9ccb0;--boneS:#8f7a4e;--ok:#4cc38a;--soft:#222a3a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.hrow{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;margin-right:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:99px;cursor:pointer;font-size:14px}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{margin:6px 0 4px;font-size:22px}h3{margin:14px 0 6px;font-size:16px}
.sub{color:var(--sub);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 11px;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--ink);font-size:15px}
.item:hover,.item.on{border-color:var(--accent)}
.item small{display:block;color:var(--sub);font-size:12px}
.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-top:14px}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stage svg{width:100%;height:auto;display:block;max-height:62vh}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:14px}
.ctrl input[type=range]{flex:1;min-width:120px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.red{background:var(--ag)}.btn.green{background:var(--ok)}.btn.gray{background:#8890a0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-top:6px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.phase{font-weight:700;font-size:14px;min-width:150px}
table.info{width:100%;border-collapse:collapse;font-size:15px}
table.info th{text-align:left;width:74px;color:var(--sub);font-weight:600;vertical-align:top;padding:7px 8px 7px 0;white-space:nowrap}
table.info td{padding:7px 0;border-bottom:1px solid var(--line)}
.tip{background:var(--soft);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.name{font-size:24px;font-weight:800}
.en{color:var(--sub);font-size:14px}
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:15px;cursor:pointer}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.wrong{border-color:var(--ag);background:color-mix(in srgb,var(--ag) 14%,var(--card))}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
a{color:var(--accent)}
.refs li{font-size:14px;margin-bottom:4px}
footer{text-align:center;color:var(--sub);font-size:12px;padding:20px}
svg text{font-family:inherit}
</style>
</head>
<body>
<header><div class="hrow">
  <div class="logo">💪 근육 움직임 학습</div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main id="app"></main>
<footer>교육용 자료 · 근육 정보는 표준 해부학 교과서 기준으로 단순화했습니다 · 그림은 이해를 돕는 2D 모식도입니다</footer>

<script>
/* =========================================================
   1) 그림 도우미
   ========================================================= */
const bone = (x1, y1, x2, y2, w = 11) =>
  `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--boneS)" stroke-width="${w + 3}" stroke-linecap="round"/>` +
  `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--bone)" stroke-width="${w}" stroke-linecap="round"/>`;
const knob = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="var(--bone)" stroke="var(--boneS)" stroke-width="1.5"/>`;
const poly = (pts, cls = 'skin') => `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="var(--${cls})" ${cls === 'bone' ? 'stroke="var(--boneS)" stroke-width="1.5"' : ''}/>`;
const skinPath = d => `<path d="${d}" fill="var(--skin)"/>`;
const label = (x, y, t, s = 12) => `<text x="${x}" y="${y}" font-size="${s}" fill="var(--sub)">${t}</text>`;

/* =========================================================
   2) 장면(관절) — J: 관절 중심, distal: 움직이는 뼈(관절 기준 좌표, x=뼈 방향)
   ========================================================= */
const SCENES = {

  shoulder: {

    prox: `${skinPath('M160 0 L220 0 L216 44 L164 44 Z')}${skinPath('M162 44 L216 44 Q222 120 206 200 L203 292 L177 292 L172 200 Q138 120 162 44 Z')}
      ${bone(190, 0, 190, 34, 13)}${knob(190, 40, 11)}${bone(181, 64, 184, 278, 5)}${bone(195, 52, 192, 284, 11)}

    distal: `${poly([[-36, 6], [-30, -16], [12, -18], [104, 2], [106, 18], [-30, 24]])}
      ${poly([[-31, 12], [-24, -8], [12, -10], [98, 6], [98, 12], [-26, 17]], 'bone')}`

  trunk: {
    name: '몸통 (척주)', view: '옆에서 본 모습 · 오른쪽이 몸 앞', J: [190, 262], zero: -90,
    prox: `${skinPath('M150 236 L236 236 L236 300 L222 420 L168 420 L152 300 Z')}
      <path d="M160 240 Q190 226 224 242 L230 268 Q210 290 192 292 L170 302 Q158 276 160 240 Z" fill="var(--bone)" stroke="var(--boneS)" stroke-width="1.5"/>

    distal: `${poly([[-10, -32], [100, -34], [168, -28], [176, -14], [176, 24], [150, 32], [90, 36], [-10, 32]])}
      ${poly([[168, -9], [196, -9], [196, 9], [168, 9]])}<circle cx="220" cy="2" r="26" fill="var(--skin)"/>
      <path d="M0 -14 Q60 -20 120 -12 T182 -14" fill="none" stroke="var(--boneS)" stroke-width="12" stroke-linecap="round"/>
      <path d="M0 -14 Q60 -20 120 -12 T182 -14" fill="none" stroke="var(--bone)" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="122" cy="6" rx="46" ry="22" fill="none" stroke="var(--boneS)" stroke-width="3" opacity=".55"/>`
  },
  wrist: {
    name: '손목 관절', view: '옆에서 본 모습 · 오른쪽이 손바닥 쪽(앞)', J: [190, 200], zero: 90,
    prox: `${skinPath('M166 0 L216 0 L213 120 Q215 178 205 216 L176 216 Q165 178 167 120 Z')}
      ${bone(183, 4, 183, 190, 9)}${bone(198, 4, 198, 196, 6)}${knob(190, 204, 11)}${label(224, 90, '아래팔')}${label(224, 70, '(앞 = 굽힘근)', 11)}${label(60, 70, '(뒤 = 폄근)', 11)}`,

      ${bone(8, 0, 104, 0, 8)}${knob(0, 0, 10)}<path d="M104 -6 L122 -5 M106 0 L124 0 M104 6 L122 5" stroke="var(--boneS)" stroke-width="3" stroke-linecap="round"/>`

      ${bone(206, 268, 300, 276, 8)}${bone(196, 256, 190, 330, 9)}${label(60, 300, '어깨·등 윗부분')}${label(246, 300, '빗장뼈')}`,

};

/* =========================================================
   3) 움직임 — 주동근(ag: 짧아짐), 길항근(an: 늘어남)
   ========================================================= */
const MOVES = [
  { id: 'elbow-flex', scene: 'elbow', a0: 90, a1: -40, name: '팔꿈치 굽힘', term: '굽힘(굴곡, Flexion)', def: '두 뼈 사이 각도가 작아지는 움직임. 손을 어깨 쪽으로 가져오기.', ag: ['biceps', 'brachialis', 'brachioradialis'], an: ['triceps'] },
  { id: 'elbow-ext', scene: 'elbow', a0: -40, a1: 90, name: '팔꿈치 폄', term: '폄(신전, Extension)', def: '굽힌 관절을 다시 쭉 펴는 움직임. 굽힘의 반대.', ag: ['triceps'], an: ['biceps', 'brachialis', 'brachioradialis'] },

  { id: 'hip-abd', scene: 'hipFront', a0: 90, a1: 50, name: '엉덩관절 벌림', term: '벌림(외전)', def: '다리를 옆으로 벌리기.', ag: ['gmed'], an: ['addlong'] },
  { id: 'hip-add', scene: 'hipFront', a0: 50, a1: 100, name: '엉덩관절 모음', term: '모음(내전)', def: '벌린 다리를 가운데로 모으기.', ag: ['addlong'], an: ['gmed'] },
  { id: 'knee-ext', scene: 'knee', a0: 200, a1: 90, name: '무릎 폄', term: '폄(신전)', def: '굽힌 무릎을 쭉 펴기 (공 차기).', ag: ['quad'], an: ['hams'] },
  { id: 'knee-flex', scene: 'knee', a0: 90, a1: 200, name: '무릎 굽힘', term: '굽힘(굴곡)', def: '발꿈치를 엉덩이 쪽으로 당기기.', ag: ['hams'], an: ['quad'] },

/* =========================================================
   5) 애니메이션 무대
   ========================================================= */
const D2R = Math.PI / 180;
function place(spec, J, th) {
  if (spec.a) return spec.a;
  const c = Math.cos(th * D2R), s = Math.sin(th * D2R), [al, pp] = spec.d;
  return [J[0] + al * c - pp * s, J[1] + al * s + pp * c];
}
const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
function geomAt(m, J, th) {
  const p = m.geo.pts.map(s => place(s, J, th));
  let belly, tendon = null;
  if (p.length > 2) { belly = [p[0], p[1]]; tendon = p.slice(1); }
  else if (m.geo.tendon) { const f = 1 - m.geo.tendon, mid = [p[0][0] + (p[1][0] - p[0][0]) * f, p[0][1] + (p[1][1] - p[0][1]) * f]; belly = [p[0], mid]; tendon = [mid, p[1]]; }
  else belly = p;
  let L = 0; for (let i = 1; i < p.length; i++) L += dist(p[i - 1], p[i]);
  return { p, belly, tendon, L };
}

let STAGE = null;
function stopStage() { if (STAGE) { cancelAnimationFrame(STAGE.raf); STAGE = null; } }

/* cfg: { move, roles:{id:'ag'|'an'}, focus: id (기시·정지 표시), hideNames } */
function mountStage(el, cfg) {
  stopStage();
  const mv = MV[cfg.move], sc = SCENES[mv.scene], J = sc.J;
  const ids = MUSCLES.filter(m => MV[m.move].scene === mv.scene).map(m => m.id);
  const order = ids.slice().sort((a, b) => (cfg.roles[a] === 'ag') - (cfg.roles[b] === 'ag') || (!!cfg.roles[a]) - (!!cfg.roles[b]));
  const Lmax = {};
  ids.forEach(id => { let mx = 0; for (let k = 0; k <= 24; k++) mx = Math.max(mx, geomAt(M[id], J, mv.a0 + (mv.a1 - mv.a0) * k / 24).L); Lmax[id] = mx; });

  const col = r => r === 'ag' ? ['var(--ag)', 'var(--agS)'] : r === 'an' ? ['var(--an)', 'var(--anS)'] : ['var(--other)', 'var(--other)'];
  el.innerHTML = `
    <svg viewBox="0 0 400 420" role="img" aria-label="${sc.name} 움직임">
      ${sc.prox}
      <g id="dist">${sc.distal}</g>
      ${order.map(id => { const [f, s] = col(cfg.roles[id]); const op = cfg.roles[id] ? 1 : .45;
        return `<g opacity="${op}"><path id="t-${id}" fill="none" stroke="${f}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>
        <path id="bo-${id}" fill="none" stroke="${s}" stroke-linecap="round"/><path id="b-${id}" fill="none" stroke="${f}" stroke-linecap="round"/><path id="h-${id}" fill="none" stroke="#fff" stroke-linecap="round" opacity=".26"/></g>`; }).join('')}
      <circle cx="${J[0]}" cy="${J[1]}" r="4" fill="var(--ink)" opacity=".6"/>
      ${cfg.focus ? `<g id="oi"><circle id="o-dot" r="7" fill="#1f9d61" stroke="#fff" stroke-width="2"/><text id="o-t" font-size="12" font-weight="700" fill="#1f9d61">기시</text>
        <circle id="i-dot" r="7" fill="#f2a516" stroke="#fff" stroke-width="2"/><text id="i-t" font-size="12" font-weight="700" fill="#d48700">정지</text></g>` : ''}
      <rect x="0" y="0" width="400" height="24" fill="var(--card)" opacity=".85"/><text x="8" y="16" font-size="12" fill="var(--sub)">${sc.view}</text>
      <text id="ang" x="392" y="410" text-anchor="end" font-size="13" fill="var(--sub)"></text>
    </svg>
    <div class="ctrl"><button class="btn" id="pp">⏸ 멈춤</button><span class="phase" id="ph"></span>
      <input type="range" id="sl" min="0" max="1000" value="0" aria-label="움직임 위치"><label>속도 <select id="sp"><option value=".5">느리게</option><option value="1" selected>보통</option><option value="1.8">빠르게</option></select></label></div>
    <div class="legend"><span><i class="dot" style="background:var(--ag)"></i>주동근: 수축(짧아지고 두꺼워짐)</span>
      ${Object.values(cfg.roles).includes('an') ? '<span><i class="dot" style="background:var(--an)"></i>길항근: 늘어남(얇아짐)</span>' : ''}
      ${cfg.focus ? '<span><i class="dot" style="background:#1f9d61"></i>기시(고정된 쪽)</span><span><i class="dot" style="background:#f2a516"></i>정지(움직이는 쪽)</span>' : ''}</div>`;

  const q = s => el.querySelector(s);
  const st = { raf: 0, phase: 0, playing: true, speed: 1, last: performance.now() };
  STAGE = st;
  q('#pp').onclick = () => { st.playing = !st.playing; q('#pp').textContent = st.playing ? '⏸ 멈춤' : '▶ 재생'; st.last = performance.now(); };
  q('#sp').onchange = e => st.speed = +e.target.value;
  q('#sl').oninput = e => { st.playing = false; q('#pp').textContent = '▶ 재생'; st.phase = Math.acos(1 - 2 * (+e.target.value / 1000)); draw(); };

  function draw() {
    const e = (1 - Math.cos(st.phase)) / 2, th = mv.a0 + (mv.a1 - mv.a0) * e;
    const forward = Math.sin(st.phase % (2 * Math.PI)) >= 0;
    q('#dist').setAttribute('transform', `translate(${J[0]},${J[1]}) rotate(${th})`);
    ids.forEach(id => {
      const m = M[id], g = geomAt(m, J, th);
      const k = Math.min(1.7, Math.max(.7, Math.pow(Lmax[id] / g.L, 1.1)));
      const [a, b] = g.belly, dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
      const bu = m.geo.bulge * (0.6 + 0.4 * k), cx = (a[0] + b[0]) / 2 + (-dy / len) * bu, cy = (a[1] + b[1]) / 2 + (dx / len) * bu;
      const d = `M${a[0]} ${a[1]} Q${cx} ${cy} ${b[0]} ${b[1]}`, w = m.geo.w * k;
      q('#b-' + id).setAttribute('d', d); q('#b-' + id).setAttribute('stroke-width', w);
      q('#h-' + id).setAttribute('d', d); q('#h-' + id).setAttribute('stroke-width', w * .34);
      q('#bo-' + id).setAttribute('d', d); q('#bo-' + id).setAttribute('stroke-width', w + 3);
      q('#t-' + id).setAttribute('d', g.tendon ? 'M' + g.tendon.map(p => p.join(' ')).join(' L') : '');
      if (id === cfg.focus) {
        const o = g.p[0], i = g.p[g.p.length - 1];
        q('#o-dot').setAttribute('cx', o[0]); q('#o-dot').setAttribute('cy', o[1]);
        q('#o-t').setAttribute('x', o[0] + 10); q('#o-t').setAttribute('y', o[1] - 8);
        q('#i-dot').setAttribute('cx', i[0]); q('#i-dot').setAttribute('cy', i[1]);
        q('#i-t').setAttribute('x', i[0] + 10); q('#i-t').setAttribute('y', i[1] + 18);
      }
    });
    q('#ang').textContent = `${sc.name} 각도 ${Math.round(Math.abs(th - sc.zero))}°`;
    q('#ph').textContent = forward ? `▶ ${mv.name} 중` : '◀ 제자리로 돌아가는 중';
    q('#sl').value = Math.round(e * 1000);
  }
  function tick(now) {
    if (STAGE !== st) return;
    const dt = Math.min(.05, (now - st.last) / 1000); st.last = now;
    if (st.playing) st.phase += dt * 1.6 * st.speed;
    draw(); st.raf = requestAnimationFrame(tick);
  }
  draw(); st.raf = requestAnimationFrame(tick);
}
const singleRoles = id => { const r = { [id]: 'ag' }; MV[M[id].move].an.forEach(a => r[a] = 'an'); return r; };

    <p class="sub">근육을 고르면 그 근육이 <b style="color:var(--ag)">빨갛게</b> 수축하며 관절을 움직여요. <b>기시</b>(초록, 안 움직이는 쪽)에서 <b>정지</b>(주황, 끌려오는 쪽)를 당긴다고 생각하세요.</p>
    <div class="chips">${REGIONS.map(r => `<button class="chip ${r === region ? 'on' : ''}" data-r="${r}">${r}</button>`).join('')}</div>
    <div class="list">${list.map(x => `<button class="item ${x.id === selMuscle ? 'on' : ''}" data-id="${x.id}">${x.ko}<small>${x.en} · ${MV[x.move].name}</small></button>`).join('')}</div>
    <div class="layout"><div class="card stage" id="stage"></div><div class="card">${infoTable(m)}</div></div>`;
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => { region = b.dataset.r; atlas(); });
  app.querySelectorAll('.item').forEach(b => b.onclick = () => { selMuscle = b.dataset.id; atlas(); document.getElementById('stage').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); });
  app.querySelectorAll('[data-m]').forEach(a => a.onclick = e => { e.preventDefault(); selMuscle = a.dataset.m; region = '전체'; atlas(); });
  mountStage(document.getElementById('stage'), { move: m.move, roles: singleRoles(m.id), focus: m.id });
}

function moves() {
  const mv = MV[selMove], roles = {};
  mv.ag.forEach(a => roles[a] = 'ag'); mv.an.forEach(a => roles[a] = 'an');
  app.innerHTML = `<h2>움직임으로 이해하기</h2>
    <p class="sub">모든 움직임은 <b style="color:var(--ag)">주동근</b>(당기는 팀)과 <b style="color:var(--an)">길항근</b>(반대 팀, 늘어나며 브레이크)의 줄다리기예요.</p>
    <div class="list">${MOVES.map(x => `<button class="item ${x.id === selMove ? 'on' : ''}" data-id="${x.id}">${x.name}<small>${SCENES[x.scene].name}</small></button>`).join('')}</div>
    <div class="layout"><div class="card stage" id="stage"></div>
      <div class="card"><div class="name">${mv.name}</div><div class="en">${mv.term}</div>
        <div class="tip">${mv.def}</div>
        <h3 style="color:var(--ag)">주동근 (짧아짐)</h3><div>${mv.ag.map(a => `<a href="#" data-m="${a}">${M[a].ko}</a> <span class="sub">— ${M[a].n}</span>`).join('<br>')}</div>
        <h3 style="color:var(--an)">길항근 (늘어남)</h3><div>${mv.an.map(a => `<a href="#" data-m="${a}">${M[a].ko}</a>`).join('<br>')}</div>
        <div class="tip">🔑 <b>규칙</b> — 근육은 <b>당기기만</b> 해요. 그래서 반대 방향 움직임은 반대편 근육이 맡아요. 근육이 관절의 <b>앞</b>을 지나면 보통 굽힘, <b>뒤</b>를 지나면 폄이에요 (무릎·발목은 반대처럼 보이니 그림으로 확인!).</div>
      </div></div>`;
  app.querySelectorAll('.item').forEach(b => b.onclick = () => { selMove = b.dataset.id; moves(); });
  app.querySelectorAll('[data-m]').forEach(a => a.onclick = e => { e.preventDefault(); selMuscle = a.dataset.m; region = '전체'; tab = 'atlas'; render(); });
  mountStage(document.getElementById('stage'), { move: selMove, roles });
}

/* ---------- 몸 지도 ---------- */
// [앞/뒤, x, y, 깊은근육(true)]  — 화면 왼쪽 = 그림 속 사람의 오른쪽(앞면) / 뒷면은 반대
const BODYPOS = {
  scm: ['f', 100, 62], deltoid: ['f', 56, 86], pecmajor: ['f', 90, 106], subscap: ['f', 80, 94, 1], coracobr: ['f', 62, 118],
  biceps: ['f', 49, 122], brachialis: ['f', 46, 140, 1], brachioradialis: ['f', 40, 172], fcr: ['f', 47, 190], fcu: ['f', 38, 202],
  rectab: ['f', 112, 150], extoblique: ['f', 80, 164], iliopsoas: ['f', 92, 226, 1], tfl: ['f', 64, 244], sartorius: ['f', 86, 262],
  rectusfem: ['f', 82, 282], quad: ['f', 96, 300], addlong: ['f', 100, 252], gracilis: ['f', 104, 278], tibant: ['f', 82, 372], edl: ['f', 92, 386],
  splenius: ['b', 110, 56], trapezius: ['b', 110, 84], supraspinatus: ['b', 138, 84, 1], infraspinatus: ['b', 140, 104], teresminor: ['b', 152, 116],
  teresmajor: ['b', 154, 130], triceps: ['b', 172, 126], lat: ['b', 128, 156], erector: ['b', 110, 176], ecrl: ['b', 172, 186], ecu: ['b', 182, 200],
  gmed: ['b', 140, 226], gmax: ['b', 120, 244], addmag: ['b', 106, 276], hams: ['b', 124, 296], gastroc: ['b', 126, 360], soleus: ['b', 128, 384, 1]
};
let mapSel = null, mapHide = false;
function bodyFig(view) {
  const arm = 'M62 78 Q44 86 40 130 L36 190 L34 232 L50 232 L54 190 L60 150 L68 100 Z', leg = 'M70 224 L110 224 L108 330 L100 424 L78 424 L76 330 Z';
  const sh = 'fill="var(--skin)" stroke="var(--line)" stroke-width="2"';
  const dots = MUSCLES.filter(m => BODYPOS[m.id] && BODYPOS[m.id][0] === view).map(m => {
    const [, x, y, deep] = BODYPOS[m.id], n = MUSCLES.indexOf(m) + 1, on = m.id === mapSel;
    return `<g class="dt" data-id="${m.id}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="9" fill="${on ? '#f2a516' : 'var(--ag)'}" stroke="#fff" stroke-width="1.6" ${deep ? 'stroke-dasharray="3 2" opacity=".8"' : ''}/>
      <text x="${x}" y="${y + 3.5}" font-size="9.5" font-weight="700" text-anchor="middle" fill="#fff" pointer-events="none">${n}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 220 440" style="width:100%;max-width:260px"><text x="110" y="436" text-anchor="middle" font-size="12" fill="var(--sub)">${view === 'f' ? '앞모습' : '뒷모습'}</text>
    <circle cx="110" cy="30" r="20" ${sh}/><rect x="100" y="48" width="20" height="24" ${sh}/>
    <path d="M68 74 Q110 62 152 74 L158 120 L146 190 L152 226 L68 226 L74 190 L62 120 Z" ${sh}/>
    <path d="${arm}" ${sh}/><path d="${arm}" ${sh} transform="translate(220,0) scale(-1,1)"/>
    <path d="${leg}" ${sh}/><path d="${leg}" ${sh} transform="translate(220,0) scale(-1,1)"/>${dots}</svg>`;
}
function bodymap() {
  const m = mapSel && M[mapSel];
  app.innerHTML = `<h2>몸 지도 — 위치로 외우기</h2>
    <p class="sub">번호를 눌러 근육을 확인하세요. 점선 원은 <b>깊은 근육</b>(겉에서 안 보임). 아래 <b>이름 가리기</b>를 켜고 번호만 보고 이름을 맞혀 보세요.</p>
    <div class="ctrl" style="margin-bottom:8px"><button class="btn ghost" id="hide">${mapHide ? '👁 이름 보이기' : '🙈 이름 가리기'}</button></div>
    <div class="layout"><div class="card" style="display:flex;gap:6px;justify-content:center;align-items:flex-start">${bodyFig('f')}${bodyFig('b')}</div>
      <div class="card">${m ? `${infoTable(m)}<div class="ctrl" style="margin-top:10px"><button class="btn" id="go">▶ 움직임 애니메이션 보기</button></div>` : '<p class="sub">왼쪽 그림에서 번호를 눌러 보세요.</p>'}
        ${mapHide ? '' : `<h3>번호표</h3><div class="list" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${MUSCLES.map((x, i) => `<button class="item ${x.id === mapSel ? 'on' : ''}" data-id="${x.id}" style="padding:6px 10px">${i + 1}. ${x.ko}</button>`).join('')}</div>`}</div></div>`;
  app.querySelectorAll('[data-id]').forEach(e => e.onclick = () => { mapSel = e.dataset.id; bodymap(); });
  app.querySelectorAll('[data-m]').forEach(a => a.onclick = e => { e.preventDefault(); mapSel = a.dataset.m; bodymap(); });
  document.getElementById('hide').onclick = () => { mapHide = !mapHide; bodymap(); };
  const go = document.getElementById('go'); if (go) go.onclick = () => { selMuscle = mapSel; region = '전체'; tab = 'atlas'; render(); };
}

let card = null, flipped = false, cardMode = 'name';
function nextCard() {
  const box = loadBox(), pool = MUSCLES.filter(m => m.id !== (card && card.id));
  const w = pool.map(m => 1 / Math.pow(box[m.id] || 1, 2)), tot = w.reduce((a, b) => a + b, 0);
  let r = Math.random() * tot; card = pool.find((m, i) => (r -= w[i]) <= 0) || pool[0]; flipped = false;
}
function cards() {
  if (!card) nextCard();
  const box = loadBox(), known = MUSCLES.filter(m => (box[m.id] || 1) >= 4).length;
  const m = card, b = box[m.id] || 1;
  const front = cardMode === 'name'
    ? `<div class="sub">이 근육의 기시·정지·작용·신경은?</div><div class="name" style="font-size:32px;margin:10px 0">${m.ko}</div><div class="en">${m.en}</div>`
    : `<div class="sub">빨간 근육의 이름은? (작용: ${MV[m.move].name})</div><div class="stage" id="stage"></div>`;
  app.innerHTML = `<h2>암기카드</h2>
    <p class="sub">"알아요"를 누른 카드는 덜 나오고, "몰라요"는 자주 나와요 (라이트너 상자 방식). 진도는 이 기기에 저장돼요.</p>
    <div class="chips"><button class="chip ${cardMode === 'name' ? 'on' : ''}" data-c="name">앞면: 이름 → 내용</button><button class="chip ${cardMode === 'anim' ? 'on' : ''}" data-c="anim">앞면: 움직임 → 이름</button></div>
    <div class="ctrl" style="margin-bottom:10px"><span>외운 근육 ${known}/${MUSCLES.length}</span><div class="bar" style="flex:1"><i style="width:${known / MUSCLES.length * 100}%"></i></div><span class="sub">이 카드 상자 ${b}/5</span></div>
    <div class="layout">
      <div class="card flash">${front}${!flipped ? '<div style="margin-top:14px"><button class="btn" id="flip">정답 보기 (뒤집기)</button></div>' : ''}</div>
      <div class="card">${flipped ? `${infoTable(m)}<div class="ctrl" style="margin-top:14px">
        <button class="btn red" data-g="0">😵 몰라요</button><button class="btn gray" data-g="1">🤔 헷갈려요</button><button class="btn green" data-g="2">😎 알아요</button></div>`
        : '<p class="sub">먼저 머릿속으로 답을 말해 본 뒤 뒤집어 보세요. 소리 내서 말하면 더 잘 외워져요.</p>'}${flipped && cardMode === 'name' ? '<div class="stage" id="stage2" style="margin-top:12px"></div>' : ''}</div>
    </div>`;
  app.querySelectorAll('[data-c]').forEach(x => x.onclick = () => { cardMode = x.dataset.c; flipped = false; cards(); });
  const f = document.getElementById('flip'); if (f) f.onclick = () => { flipped = true; cards(); };
  app.querySelectorAll('[data-g]').forEach(x => x.onclick = () => {
    const bx = loadBox(), g = +x.dataset.g, cur = bx[m.id] || 1;
    bx[m.id] = g === 0 ? 1 : g === 1 ? cur : Math.min(5, cur + 1); saveBox(bx); nextCard(); cards();
  });
  app.querySelectorAll('[data-m]').forEach(a => a.onclick = e => e.preventDefault());
  const s = document.getElementById(cardMode === 'anim' ? 'stage' : 'stage2');
  if (s) mountStage(s, { move: m.move, roles: { [m.id]: 'ag' }, focus: flipped ? m.id : null });
}

let Q = null;
function makeQuiz() {
  const types = ['anim', 'act', 'nerve', 'ins', 'act2name'];
  const qs = shuffle(MUSCLES).slice(0, 10).map((m, i) => {
    const t = types[i % types.length];
    const pick = (field, correct) => shuffle([correct, ...shuffle([...new Set(MUSCLES.map(x => x[field]))].filter(v => v !== correct)).slice(0, 3)]);
    if (t === 'anim' || t === 'act2name') {
      const opts = shuffle([m, ...shuffle(MUSCLES.filter(x => x.id !== m.id && (t === 'anim' ? true : x.qa !== m.qa))).slice(0, 3)]);
      return { m, t, q: t === 'anim' ? '그림에서 빨갛게 수축하는 근육은?' : `주된 작용이 "${m.qa}"인 근육은?`, opts: opts.map(x => x.ko), ans: m.ko };
    }
    const f = { act: 'qa', nerve: 'qn', ins: 'qi' }[t];
    return { m, t, q: `${m.ko}의 ${{ act: '주된 작용', nerve: '신경 지배', ins: '정지(붙는 곳)' }[t]}은?`, opts: pick(f, m[f]), ans: m[f] };
  });
  Q = { qs, i: 0, score: 0, wrong: [], done: false };
}
function quiz() {
  if (!Q) makeQuiz();
  if (Q.i >= Q.qs.length) {
    app.innerHTML = `<h2>퀴즈 결과</h2><div class="card"><div class="name">${Q.qs.length}문제 중 ${Q.score}개 정답 ${Q.score >= 8 ? '🎉' : '💪'}</div>
      ${Q.wrong.length ? `<h3>다시 볼 근육</h3>${[...new Set(Q.wrong)].map(id => `<a href="#" data-m="${id}">${M[id].ko}</a>`).join(' · ')}` : '<p>완벽해요!</p>'}
      <div style="margin-top:14px"><button class="btn" id="again">새 퀴즈 풀기</button></div></div>`;
    document.getElementById('again').onclick = () => { makeQuiz(); quiz(); };
    app.querySelectorAll('[data-m]').forEach(a => a.onclick = e => { e.preventDefault(); selMuscle = a.dataset.m; region = '전체'; tab = 'atlas'; render(); });
    return;
  }
  const it = Q.qs[Q.i];
  app.innerHTML = `<h2>퀴즈 <span class="sub">${Q.i + 1} / ${Q.qs.length} · 점수 ${Q.score}</span></h2>
    <div class="layout"><div class="card">${it.t === 'anim' ? '<div class="stage" id="stage"></div>' : `<div class="flash"><div class="name">${it.t === 'act2name' ? '🤔' : it.m.ko}</div><div class="en">${it.t === 'act2name' ? '' : it.m.en}</div></div>`}</div>
      <div class="card"><b>${it.q}</b>${it.opts.map((o, k) => `<button class="opt" data-k="${k}">${o}</button>`).join('')}<div id="fb"></div></div></div>`;
  if (it.t === 'anim') mountStage(document.getElementById('stage'), { move: it.m.move, roles: { [it.m.id]: 'ag' } });
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (app.querySelector('.opt.right')) return;
    const ok = it.opts[+b.dataset.k] === it.ans;
    app.querySelectorAll('.opt').forEach(x => { if (it.opts[+x.dataset.k] === it.ans) x.classList.add('right'); else if (x === b) x.classList.add('wrong'); });
    if (ok) Q.score++; else Q.wrong.push(it.m.id);
    document.getElementById('fb').innerHTML = `<div class="tip">${ok ? '정답! ' : '아쉬워요. '}<b>${it.m.ko}</b> — ${it.m.act} (${it.m.n})</div>
      <div style="margin-top:10px"><button class="btn" id="nx">${Q.i + 1 < Q.qs.length ? '다음 문제 →' : '결과 보기'}</button></div>`;
    document.getElementById('nx').onclick = () => { Q.i++; quiz(); };
  });
}

function refs() {
  app.innerHTML = `<h2>참고자료 · 용어 정리</h2>
    <div class="layout"><div class="card"><h3>기본 용어</h3><table class="info">
      <tr><th>기시</th><td>근육이 시작하는 곳. 보통 몸통 쪽, 움직이지 않는 뼈 (origin)</td></tr>
      <tr><th>정지</th><td>근육이 끝나 붙는 곳. 수축하면 이쪽 뼈가 끌려와 움직임 (insertion)</td></tr>
      <tr><th>작용</th><td>근육이 수축할 때 생기는 움직임 (action)</td></tr>
      <tr><th>신경</th><td>근육에 "수축하라"는 명령을 전달하는 신경 (innervation)</td></tr>
      <tr><th>주동근</th><td>움직임을 주로 만드는 근육 (agonist)</td></tr>
      <tr><th>길항근</th><td>반대 방향 움직임을 만드는 근육, 늘어나며 속도 조절 (antagonist)</td></tr>
      <tr><th>두관절근</th><td>관절 두 개를 넘는 근육 (넙다리곧은근, 햄스트링, 장딴지근)</td></tr>
      <tr><th>힘줄</th><td>근육 끝의 질긴 끈. 그림의 가는 선 (tendon)</td></tr>
      <tr><th>SITS</th><td>돌림근띠 4개: 가시위(S)·가시아래(I)·작은원(T)·어깨밑(S) — 어깨를 안정시키는 근육</td></tr>
      <tr><th>위관절융기</th><td>아래팔 <b>굽힘근은 안쪽</b>(골퍼 팔꿈치), <b>폄근은 가쪽</b>(테니스 팔꿈치)에서 시작</td></tr>
      <tr><th>신경 공식</th><td>아래팔 폄근 = 노신경 / 굽힘근 = 정중신경 (예외: 자쪽손목굽힘근 = 자신경) / 모음근 = 폐쇄신경 / 넙다리 앞 = 넙다리신경 / 넙다리 뒤 = 궁둥신경</td></tr></table>
      <p class="sub">용어는 대한해부학회 새 용어를 쓰고, 괄호에 옛 한자 용어를 같이 적었어요.</p></div>
    <div class="card"><h3>참고 교과서·자료</h3><ul class="refs">
      <li><a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/11-introduction" target="_blank" rel="noopener">OpenStax, Anatomy and Physiology 2e — 11장 근육계 (무료)</a></li>
      <li>Drake, Vogl, Mitchell — <i>Gray's Anatomy for Students</i> (기시·정지·신경 기준)</li>
      <li>Netter — <i>Atlas of Human Anatomy</i> (근육 그림 아틀라스)</li>
      <li>Neumann — <i>Kinesiology of the Musculoskeletal System</i> (움직임·주동근/길항근)</li>
      <li>Kendall et al. — <i>Muscles: Testing and Function</i> (근육별 기능 검사)</li>
      <li><b>이번 확장판 조사 자료</b> (교차 확인용, 교과서와 함께 보세요):</li>
      <li><a href="https://www.kenhub.com/en/library/anatomy/the-rotator-cuff" target="_blank" rel="noopener">Kenhub — 돌림근띠(Rotator cuff)</a></li>
      <li><a href="https://images.radiopaedia.org/articles/teres-minor" target="_blank" rel="noopener">Radiopaedia — Teres minor</a></li>
      <li><a href="https://kenhub.com/en/library/anatomy/radial-muscles-of-the-forearm" target="_blank" rel="noopener">Kenhub — 아래팔 노쪽 근육</a> · <a href="https://anatomy.ttuhscep.edu/schemes/forearm_ans.html" target="_blank" rel="noopener">TTUHSC — 아래팔 신경·근육 도식</a></li>
      <li><a href="https://kenhub.com/en/library/anatomy/the-sartorius-muscle" target="_blank" rel="noopener">Kenhub — Sartorius</a> · <a href="https://wikimsk.org/wiki/Sartorius" target="_blank" rel="noopener">WikiMSK — Sartorius</a></li>
      <li class="sub">조사 중 확인된 차이: 긴노쪽손목폄근 기시(위능선 vs 가쪽위관절융기), 어깨밑근·큰원근 신경 분절(C5–C6 vs C5–C7) 등은 자료마다 달라서 표준 교과서 표기를 우선했어요.</li>
      ${MUSCLES.map(m => `<li><a href="https://en.wikipedia.org/wiki/${WIKI[m.id]}" target="_blank" rel="noopener">${m.ko} — ${m.en}</a></li>`).join('')}
    </ul><p class="sub">신경 번호(C5 등)는 교과서마다 조금씩 다를 수 있어요. 그림은 이해용 2D 단순화예요 (뒤침·돌림 같은 회전 동작은 설명으로만 다뤄요).</p></div></div>`;
}

render();
</script>
